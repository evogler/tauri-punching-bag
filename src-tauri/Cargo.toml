[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.57"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The app is a library so iOS can link it as a static library into the Xcode
# project (`gen/apple`); `main.rs` is a one-line binary over it for the Mac.
[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomic_float = "0.1.0"
coreaudio-rs = "0.11.1"
dirs = "6"
rand = { version = "0.8.5" }
realfft = "3.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.1", features = ["mp3"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Desktop only: iOS has no system-wide keys to register, and an iOS app updates
# through the App Store or TestFlight, never by downloading its own code.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

# The iOS audio session, configured in Swift. See plugins/audio-session.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-audio-session = { path = "plugins/audio-session" }
