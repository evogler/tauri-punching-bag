[package]
name = "tauri-plugin-audio-session"
version = "0.1.0"
description = "The iOS audio session for tauri-punching-bag: AVAudioSession set up in Swift, its notifications forwarded to Rust."
edition = "2021"
# Tauri's build helpers find the Swift package through the `links` name.
links = "tauri-plugin-audio-session"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
